[project]
name = "interconnectorauctions"
version = "0.1.0"
description = "Interactive explorer for NESO interconnector requirement and auction data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.24",
    "requests>=2.32",
    "streamlit>=1.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
